# 七零喵团队站点 · Docker 环境下的 nginx 反向代理
# 与 deploy/nginx/team-site.conf 等价，但面向容器网络（backend 为服务名）

# 防 CC 限流区（http 上下文）
limit_req_zone $binary_remote_addr zone=qlm_req:10m rate=15r/s;
limit_conn_zone $binary_remote_addr zone=qlm_conn:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 200m;
    client_body_timeout 300s;
    send_timeout 300s;

    # 防 CC：单 IP 并发 20 / 速率 15r/s（突发 30）
    limit_conn qlm_conn 20;
    limit_req zone=qlm_req burst=30 nodelay;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 后端 API
    location /api/ {
        proxy_pass http://backend:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    # 上传的文件：容器内直接由 nginx 分发（/data 以只读方式挂载）
    location /uploads/ {
        alias /data/uploads/;
        autoindex off;
        location ~* \.(php|phtml|jsp|asp|aspx|cgi|pl|py|rb|sh)$ { deny all; }
        location ~* /\. { deny all; }
    }

    location ~* \.(?:png|jpe?g|gif|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) { deny all; }
}
