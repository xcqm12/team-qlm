# 七零喵团队站点 · nginx 站点配置
# 由 deploy/install.sh 自动渲染（宝塔面板会加载 /www/server/panel/vhost/nginx/*.conf）
#
# 该配置的职责：
#   1. 直接分发前端静态资源（frontend/dist）
#   2. 把 /api 与 /uploads 反向代理给 Node 后端
#   3. SPA 路由回退到 index.html
#   4. 上传目录禁止执行任何脚本，防止恶意文件被解析
#   5. 防 CC：按 IP 限制请求速率（limit_req）与并发连接数（limit_conn）

# ---------- 防 CC 限流区（必须位于 http 上下文，宝塔 vhost 文件正是被 http 包含）----------
# 【重要】如果站点前面还有 Cloudflare / 宝塔防火墙 / 其他 CDN 反代，
# 必须让 nginx 拿到真实客户端 IP，否则所有访客都会被算成同一个 IP 而被误限流：
#
#   set_real_ip_from 173.245.48.0/20;     # Cloudflare 出口网段（按官方列表补全）
#   set_real_ip_from 103.21.244.0/22;
#   real_ip_header CF-Connecting-IP;      # Cloudflare；宝塔反代用 X-Forwarded-For
#   real_ip_recursive on;
#
# qlm_req：单 IP 每秒 15 个请求（突发 30，超出直接 429）
limit_req_zone $binary_remote_addr zone=qlm_req:10m rate=15r/s;
# qlm_conn：单 IP 并发连接数上限 20
limit_conn_zone $binary_remote_addr zone=qlm_conn:10m;
# qlm_api_conn：API 单 IP 并发 10
limit_conn_zone $binary_remote_addr zone=qlm_api_conn:10m;
limit_req_status 429;
limit_conn_status 429;
# 触发限流时返回 JSON，而不是 nginx 默认 HTML（前端能直接读到 message）
limit_req_log_level warn;
limit_conn_log_level warn;
recursive_error_pages off;
error_page 429 = @too_many_requests;
error_page 503 = @server_busy;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root __ROOT__;
    index index.html;

    access_log /www/wwwlogs/__SERVICE_NAME__.log;
    error_log  /www/wwwlogs/__SERVICE_NAME__.error.log;

    # 与后端 MAX_UPLOAD_SIZE 保持一致（install.sh 会自动换算）
    client_max_body_size __CLIENT_MAX_BODY__;
    client_body_timeout 300s;
    send_timeout 300s;

    # ---------- 防 CC ----------
    limit_conn qlm_conn 20;                # 单 IP 总并发连接
    limit_req zone=qlm_req burst=30 nodelay;  # 单 IP 请求速率（全站）

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_vary on;

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---------- 后端 API ----------
    location /api/ {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;   # 大文件上传直接透传，降低内存占用

        # API 额外收紧：单 IP 并发 10，速率 10r/s（突发 20）
        limit_conn qlm_api_conn 10;
        limit_req zone=qlm_req burst=20 nodelay;
    }

    # ---------- 上传文件（图片内联展示，其余强制下载） ----------
    location /uploads/ {
        alias __UPLOAD_DIR__/;
        autoindex off;

        # 任何脚本/配置类文件都不允许被执行或解析
        location ~* \.(php|php[0-9]|phtml|phar|jsp|jspx|asp|aspx|ashx|cgi|pl|py|rb|sh|lua)$ {
            deny all;
        }
        location ~* /\. { deny all; }
    }

    # ---------- 静态资源缓存 ----------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:png|jpe?g|gif|webp|svg|ico|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---------- SPA 路由回退 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏文件与源码目录访问
    location ~ /\.(?!well-known) { deny all; }
    location ~* ^/(backend|deploy|tools|node_modules|docs)/ { deny all; }

    # ---------- 被限流/繁忙时的 JSON 响应（便于前端直接展示 message） ----------
    location @too_many_requests {
        default_type application/json;
        add_header Retry-After 10 always;
        add_header X-CC-Protection nginx always;
        return 429 '{"success":false,"message":"请求过于频繁，请稍后重试","retryAfter":10}';
    }

    location @server_busy {
        default_type application/json;
        add_header Retry-After 5 always;
        add_header X-CC-Protection nginx always;
        return 503 '{"success":false,"message":"服务器繁忙，请稍后重试","retryAfter":5}';
    }
}
